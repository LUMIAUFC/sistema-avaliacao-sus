<title>Avaliação SUS</title>
<meta name="description" content="Aplicação, cálculo e exportação da Escala de Usabilidade do Sistema (SUS).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap">
<style>
/* Layout: coluna única de leitura (máx. 46rem), barra de progresso fixa no topo, resultado em página própria. */
:root {
  --paper: #F3F5F3;
  --surface: #FFFFFF;
  --ink: #17212A;
  --muted: #56636C;
  --line: #D3D9D6;
  --accent: #1D5466;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1ECEE;
  --danger: #9E2F26;
  --danger-soft: #FBEAE7;
  --ok: #2C6A3B;
  --focus: #C2410C;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121A1F; --surface: #1A242B; --ink: #E6ECEA; --muted: #9CAAB1; --line: #2F3D45;
    --accent: #7FC0CF; --accent-ink: #0E1A1F; --accent-soft: #1F3640; --danger: #F08A7E; --danger-soft: #3A2220;
    --ok: #86C796; --focus: #FDBA74; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121A1F; --surface: #1A242B; --ink: #E6ECEA; --muted: #9CAAB1; --line: #2F3D45;
  --accent: #7FC0CF; --accent-ink: #0E1A1F; --accent-soft: #1F3640; --danger: #F08A7E; --danger-soft: #3A2220;
  --ok: #86C796; --focus: #FDBA74; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; }
.wrap { max-width: 46rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 4rem; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 4.5vw, 2.15rem); }
h2 { font-size: 1.3rem; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.eyebrow { font-family: var(--font-data); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* Cabeçalho */
.masthead { padding-block: 2rem 1.25rem; display: grid; gap: .5rem; }
.masthead .lede { color: var(--muted); max-width: 38rem; }
.savebar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; font-size: .875rem; color: var(--muted); }
.savebar .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ok); flex: none; }
.savebar[data-state="erro"] { color: var(--danger); font-weight: 500; }
.savebar[data-state="erro"] .dot { background: var(--danger); border-radius: 0; }

/* Progresso fixo */
.progress { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding-block: .6rem; margin-bottom: 1.5rem; }
.progress-inner { display: flex; align-items: center; gap: .9rem; }
.progress-text { font-size: .875rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.progress-text strong { font-family: var(--font-data); font-weight: 500; }
.meter { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 0; }
.meter > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s ease; }

/* Avisos */
.notice { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: .9rem 1rem; display: grid; gap: .6rem; margin-bottom: 1.5rem; }
.notice.info { border-left: 4px solid var(--accent); }
.notice.error { border-left: 4px solid var(--danger); background: var(--danger-soft); }
.notice h2 { font-family: var(--font-body); font-size: 1rem; font-weight: 600; }
.notice ul { margin: 0; padding-left: 1.2rem; }

/* Seções do formulário */
section.block { display: grid; gap: 1rem; margin-bottom: 2.25rem; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
.field { display: grid; gap: .3rem; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-weight: 500; font-size: .9375rem; }
.field .hint { font-size: .8125rem; color: var(--muted); }
.field input, .field textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .55rem .7rem; width: 100%; }
.field textarea { min-height: 5rem; resize: vertical; }
.field input[readonly] { background: transparent; border-style: dashed; font-family: var(--font-data); font-size: .9rem; }
.field .err { color: var(--danger); font-size: .875rem; font-weight: 500; }
.field.has-error input { border-color: var(--danger); border-width: 2px; }

/* Itens do SUS */
.instructions { color: var(--muted); max-width: 40rem; }
ol.items { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
fieldset.item { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); margin: 0; padding: 1rem 1rem 1.1rem; display: grid; gap: .85rem; min-width: 0; }
fieldset.item.missing { border-color: var(--danger); border-width: 2px; }
fieldset.item legend { float: left; width: 100%; padding: 0; display: grid; grid-template-columns: 2rem 1fr; gap: .25rem; font-size: 1.0625rem; font-weight: 500; }
fieldset.item legend + * { clear: both; }
.num { font-family: var(--font-data); color: var(--muted); font-weight: 400; }
.item-err { color: var(--danger); font-size: .875rem; font-weight: 500; display: flex; gap: .4rem; align-items: center; }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .4rem; }
.likert label { position: relative; display: grid; justify-items: center; align-content: start; gap: .25rem; text-align: center; padding: .55rem .3rem .6rem; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; font-size: .8125rem; line-height: 1.25; color: var(--muted); min-height: 4.4rem; }
.likert input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.likert .v { font-family: var(--font-data); font-size: 1.05rem; color: var(--ink); width: 1.9rem; height: 1.9rem; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); }
.likert label:hover { border-color: var(--accent); }
.likert input:focus-visible + .v { outline: 3px solid var(--focus); outline-offset: 2px; }
.likert input:checked + .v { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.likert label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.likert .chk { display: none; }
.likert input:checked ~ .chk { display: inline; }
@media (max-width: 34rem) {
  .likert { grid-template-columns: 1fr; }
  .likert label { grid-template-columns: 1.9rem 1fr auto; justify-items: start; align-items: center; text-align: left; min-height: 0; padding: .45rem .6rem; gap: .65rem; font-size: .875rem; }
}

/* Botões */
.actions { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: var(--r); padding: .6rem 1rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 500; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--danger); }
button.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
button.link { border: none; background: none; padding: .3rem 0; color: var(--accent); text-decoration: underline; }
button[aria-busy="true"] { opacity: .7; cursor: progress; }
button:disabled { opacity: .55; cursor: not-allowed; }
.toolbar { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 1.25rem; }

details.privacy { border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 2.5rem; font-size: .9rem; color: var(--muted); }
details.privacy summary { cursor: pointer; color: var(--ink); font-weight: 500; }
details.privacy ul { padding-left: 1.2rem; display: grid; gap: .35rem; margin: .75rem 0 0; }

/* Resultado */
.result-head { padding-block: 2rem 1rem; display: grid; gap: .4rem; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem 1.5rem; margin: 0; padding: 1rem 0; border-block: 1px solid var(--line); }
.meta div { min-width: 0; }
.meta dt { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-family: var(--font-data); }
.meta dd { margin: .15rem 0 0; overflow-wrap: anywhere; }
.score-panel { display: grid; gap: 1.1rem; padding-block: 1.75rem; }
.score { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.score .value { font-family: var(--font-display); font-size: clamp(3.5rem, 13vw, 5.5rem); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; }
.score .of { font-family: var(--font-data); color: var(--muted); font-size: 1.1rem; }
.scale { position: relative; padding-bottom: 2.4rem; }
.scale .track { height: 12px; background: var(--line); border-radius: 6px; position: relative; overflow: hidden; }
.scale .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.scale .ref { position: absolute; top: -6px; height: 24px; width: 0; border-left: 2px dashed var(--ink); }
.scale .tick { position: absolute; top: 18px; font-family: var(--font-data); font-size: .75rem; color: var(--muted); transform: translateX(-50%); white-space: nowrap; }
.scale .tick.start { transform: none; }
.scale .tick.end { transform: translateX(-100%); }
.scale .tick.reflabel { top: 34px; color: var(--ink); }
.interp { display: grid; gap: .5rem; max-width: 40rem; }
.caveats { margin: 0; padding-left: 1.2rem; color: var(--muted); font-size: .9rem; display: grid; gap: .25rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; min-width: 34rem; }
caption { text-align: left; padding: .75rem 1rem; color: var(--muted); font-size: .85rem; caption-side: bottom; border-top: 1px solid var(--line); }
th, td { padding: .6rem .75rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
thead th { font-family: var(--font-data); font-weight: 500; font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td.rule { white-space: nowrap; }
#error-summary, fieldset.item, .field { scroll-margin-top: 4.5rem; }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
tfoot td { font-weight: 600; border-bottom: none; }
.formula { font-family: var(--font-data); font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .8rem 1rem; overflow-x: auto; }
.refs { margin: 0; padding-left: 1.2rem; display: grid; gap: .5rem; font-size: .9rem; }
.refs li { overflow-wrap: anywhere; }

/* Diálogo */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 20, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dialog { background: var(--surface); color: var(--ink); border-radius: 8px; max-width: 30rem; width: 100%; padding: 1.4rem; display: grid; gap: 1rem; box-shadow: 0 18px 50px rgba(0,0,0,.3); }
.dialog h2 { font-size: 1.2rem; }
.toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: .65rem 1rem; border-radius: var(--r); font-size: .9rem; z-index: 60; max-width: calc(100% - 32px); }
.toast[data-kind="erro"] { background: var(--danger); color: var(--surface); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print { .progress, .toolbar, .actions, details.privacy, .savebar { display: none !important; } }
</style>

<div id="app" class="wrap" aria-live="off">
  <noscript><p>Esta aplicação precisa de JavaScript ativado no navegador.</p></noscript>
</div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="dialog-root"></div>
<div id="toast-root"></div>
